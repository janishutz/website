<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Error | janishutz.com</title>
        <style>
            @import url( 'https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap' );
            @import url( 'https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200' );

            body {
                height: 100vh;
                width: 100%;
                padding: 0;
                margin: 0;
                font-family: 'Manrope', sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                flex-direction: column;
            }

            .material-symbols-outlined {
                font-variation-settings:
                'FILL' 0,
                'wght' 400,
                'GRAD' 0,
                'opsz' 48
            }

            .content {
                width: 80%;
                display: flex;
                justify-content: center;
                align-items: center;
                flex-direction: column;
                min-height: 80vh;
            }

            .error {
                font-size: 5em;
            }

            .logo {
                position: fixed;
                top: 5px;
                left: 5px;
                width: 15vh;
                height: 15vh;
            }

            .button {
                padding: 20px;
                background-color: rgb(21, 43, 92);
                color: white;
                text-decoration: none;
                border-radius: 10px;
                transition: all 0.5s;
            }

            .button:hover {
                border-radius: 5px;
                background-color: rgb(2, 10, 27);
            }
        </style>
    </head>
    <body>
        <div class="content">
            <img src="https://static.janishutz.com/logo.jpg" alt="logo" class="logo">
            <span class="material-symbols-outlined error">error</span>
            <h1>Critical Error</h1>
            <p>A critical error occurred whentrying to connect you. If the issue persists, please contact me</p>
            <a href="https://support.janishutz.com/index.php?a=add?category=11" class="button">Contact Support</a>
        </div>
    </body>
</html>
